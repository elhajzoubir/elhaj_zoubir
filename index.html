<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07833f"><link rel="manifest" href="manifest.json"><title>الحاج الزوبير</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f2;font-family:Arial;color:#111;padding-bottom:80px}.app{max-width:1000px;margin:auto;padding:8px}.head{background:#07833f;color:#fff;border-radius:15px;padding:14px;text-align:center}.head h1{margin:0;font-size:28px}.head p{margin:5px 0;font-weight:bold}.card{background:#fff;border:1px solid #d9e1dc;border-radius:14px;padding:10px;margin-top:9px}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field label{display:block;text-align:center;font-weight:bold;margin-bottom:5px}.field input,.static{width:100%;height:45px;border:1px solid #ccd5d0;border-radius:9px;text-align:center;font-size:16px;background:#fff}.static{display:flex;align-items:center;justify-content:center;font-weight:bold}.scroll{overflow-x:auto}table{width:100%;min-width:700px;border-collapse:collapse}th{background:#07833f;color:white;padding:9px}td{border:1px solid #ddd;text-align:center;height:52px}td input{width:100%;height:40px;border:1px solid #ddd;border-radius:7px;text-align:center}.amount{background:#f1f7f3!important;font-weight:bold}tfoot td{font-weight:bold;background:#f4f6f5}.delete{background:#fff0f0;color:#c22;border:1px solid #e5baba;border-radius:7px;padding:7px}.add{width:100%;height:44px;margin-top:9px;border:1px solid #07833f;border-radius:9px;background:#effaf3;color:#07833f;font-weight:bold}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sum{border:1px solid #ddd;border-radius:11px;padding:11px;text-align:center}.sum b{display:block;margin-bottom:6px}.sum strong{font-size:21px}.expense{width:100%;border:0;text-align:center;font-size:21px;font-weight:bold;outline:0}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.actions button{height:48px;border:0;border-radius:9px;color:#fff;font-weight:bold}.new{background:#e83b3b}.print{background:#1688e8}.save{background:#07833f}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:5}.bottom button{border:0;background:none;font-size:12px;font-weight:bold;color:#555}.bottom span{display:block;font-size:21px}.bottom .on{color:#07833f}@media(max-width:650px){.info{grid-template-columns:1fr 1fr}.field:first-child{grid-column:1/-1}.actions{grid-template-columns:1fr 1fr}.actions .save{grid-column:1/-1}}@media print{body{padding:0}.bottom,.actions,.add,.delete{display:none!important}table{min-width:0}}
</style></head><body><div class="app"><header class="head"><h1>الحاج الزوبير</h1><p>وكيل معتمد للخضر والفواكه بالجملة</p></header>
<section class="card"><div class="info"><div class="field"><label>اسم الفلاح</label><input id="farmer"></div><div class="field"><label>رقم الفاتورة</label><input id="invoice" value="0001" inputmode="numeric"></div><div class="field"><label>التاريخ</label><input id="date" type="date"></div></div><div class="info" style="margin-top:8px"><div class="field"><label>نوع البضاعة</label><input id="goods"></div><div class="field"><label>المحل</label><div class="static">31 — خميس الخشنة</div></div></div></section>
<section class="card scroll"><table><thead><tr><th>حذف</th><th>المبلغ</th><th>السعر</th><th>الصنف</th><th>الوزن</th><th>عدد الصناديق</th><th>#</th></tr></thead><tbody id="rows"></tbody><tfoot><tr><td>—</td><td id="amount">0 دج</td><td>—</td><td>الإجمالي</td><td id="weight">0</td><td id="boxes">0</td><td>—</td></tr></tfoot></table><button class="add" id="add">＋ إضافة سطر</button></section>
<section class="card summary"><div class="sum"><b>إجمالي البيع</b><strong id="sale">0 دج</strong></div><div class="sum"><b>المصاريف</b><input id="expenses" class="expense" inputmode="decimal"></div><div class="sum"><b>النسبة</b><strong>10%</strong></div><div class="sum"><b>الصافي</b><strong id="net">0 دج</strong></div></section>
<section class="card actions"><button class="new" id="new">↻ فاتورة جديدة</button><button class="print" id="print">🖨 طباعة</button><button class="save" id="save">▣ حفظ</button></section></div>
<nav class="bottom"><button data-p="invoices"><span>▣</span>الفواتير</button><button data-p="farmers"><span>♙</span>الفلاحين</button><button data-p="home" class="on"><span>⌂</span>الرئيسية</button><button data-p="stats"><span>▥</span>الإحصائيات</button><button data-p="settings"><span>⚙</span>الإعدادات</button></nav>
<script>
(()=>{const rows=document.getElementById('rows'),K='hz_saved';const n=v=>parseFloat(String(v||'').replace(/,/g,'').replace(/[^0-9.-]/g,''))||0;const money=v=>Number(v||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' دج';const today=()=>new Date().toISOString().slice(0,10);
function ren(){[...rows.children].forEach((r,i)=>r.querySelector('.rn').textContent=i+1)}
function addRow(){let r=document.createElement('tr');r.innerHTML='<td><button class="delete">🗑</button></td><td><input class="amount" readonly></td><td><input class="price" type="number" min="0" step=".01"></td><td><input class="item"></td><td><input class="weight" type="number" min="0" step=".01"></td><td><input class="boxes" type="number" min="0"></td><td class="rn"></td>';rows.appendChild(r);ren();r.querySelector('.delete').onclick=()=>{r.remove();ren();calc()};r.querySelectorAll('input').forEach(x=>x.oninput=calc)}
function calc(){let a=0,w=0,b=0;[...rows.children].forEach(r=>{let W=n(r.querySelector('.weight').value),P=n(r.querySelector('.price').value),B=n(r.querySelector('.boxes').value),A=W*P;a+=A;w+=W;b+=B;r.querySelector('.amount').value=A?money(A):''});let e=n(document.getElementById('expenses').value),net=a-a*.1-e;amount.textContent=money(a);weight.textContent=w.toLocaleString('fr-FR');boxes.textContent=b;sale.textContent=money(a);document.getElementById('net').textContent=money(net)}
function reset(){rows.innerHTML='';for(let i=0;i<5;i++)addRow();calc()}date.value=today();reset();add.onclick=addRow;expenses.oninput=calc;print.onclick=()=>window.print();new.onclick=()=>{farmer.value='';goods.value='';expenses.value='';invoice.value=String(n(invoice.value)+1).padStart(4,'0');date.value=today();reset();scrollTo(0,0)};
save.onclick=()=>{let a=[];try{a=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}a.unshift({invoice:invoice.value,date:date.value,farmer:farmer.value,goods:goods.value,expenses:expenses.value});localStorage.setItem(K,JSON.stringify(a));alert('تم حفظ الفاتورة')};
document.querySelectorAll('.bottom button').forEach(x=>x.onclick=()=>{let p=x.dataset.p,a=[];try{a=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}if(p==='home')scrollTo(0,0);else if(p==='invoices')alert('الفواتير المحفوظة: '+a.length);else if(p==='farmers')alert(a.map(x=>x.farmer).filter(Boolean).join('\n')||'لا توجد أسماء محفوظة');else if(p==='stats')alert('عدد الفواتير: '+a.length);else alert('الإعدادات')});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
