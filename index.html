.date{top:13.1%;right:77.1%;width:19.7%;height:4.5%;font-size:18px}
.farmer{top:27.0%;right:68.0%;width:24.0%;height:4.7%;font-size:25px;font-weight:bold}
.boxTotal{top:27.0%;right:34.2%;width:24.0%;height:4.7%;font-size:25px;font-weight:bold}
.goods{top:27.0%;right:3.0%;width:24.0%;height:4.7%;font-size:25px;font-weight:bold}
/* table starts around 37.8%; columns right-to-left:
   amount 20%, price 20%, item 25%, weight 20%, boxes 15% */
.cell{height:4.25%;font-size:17px}
.r1{top:44.1%} .r2{top:47.9%} .r3{top:51.7%} .r4{top:55.5%}
.c-box{right:3.0%;width:17.8%}
.c-weight{right:20.8%;width:24.0%}
.c-item{right:43.6%;width:24.0%}
.c-price{right:66.5%;width:20.0%}
.c-amount{right:85.5%;width:11.5%;background:rgba(255,255,255,.96)}
.totalBoxes{top:59.35%;right:3.0%;width:17.8%;height:4.0%;font-weight:bold;font-size:19px}
.totalWeight{top:59.35%;right:20.8%;width:24.0%;height:4.0%;font-weight:bold;font-size:19px}
.totalAmount{top:59.35%;right:85.0%;width:14.5%;height:4.0%;font-weight:bold;font-size:18px}
/* summary */
.sumSale{top:77.25%;right:56.2%;width:19.0%;height:3.0%;font-size:17px}
.sumRate{top:80.2%;right:56.2%;width:19.0%;height:3.0%;font-size:17px}
.expenses{top:83.1%;right:56.2%;width:19.0%;height:3.0%;font-size:17px}
.net{top:86.0%;right:56.0%;width:20.0%;height:3.3%;font-size:20px;font-weight:bold}
.contact{top:93.4%;right:3.0%;width:23.0%;height:3.7%;font-size:14px}
.hidden{display:none}
@media(max-width:600px){
  body{padding:4px}
  .toolbar button{font-size:13px;padding:8px 12px}
  .field{font-size:11px}
  .invoiceNo{font-size:15px} .farmer,.boxTotal,.goods{font-size:14px}
  .cell{font-size:9px} .totalBoxes,.totalWeight{font-size:11px} .totalAmount{font-size:10px}
  .sumSale,.sumRate,.expenses{font-size:10px} .net{font-size:12px}
}
@media print{
 body{padding:0;background:#fff}
 .toolbar{display:none}
 .sheet{width:100vw;height:auto;aspect-ratio:1064/1418}
 @page{size:A4 portrait;margin:0}
}
</style>
</head>
<body>
<div class="toolbar">
<button onclick="window.print()">🖨️ طباعة / PDF</button>
<button onclick="newInvoice()">فاتورة جديدة</button>
</div>

<div class="sheet">
<input class="field invoiceNo" id="invoiceNo" value="">
<input class="field date" id="date" type="date">

<input class="field farmer" id="farmer" value="">
<input class="field boxTotal" id="boxTotal" value="" readonly>
<input class="field goods" id="goods" value="">

<div id="tableFields"></div>

<input class="field totalBoxes" id="totalBoxes" value="" readonly>
<input class="field totalWeight" id="totalWeight" value="" readonly>
<input class="field totalAmount" id="totalAmount" value="" readonly>

<input class="field sumSale" id="sumSale" value="" readonly>
<input class="field sumRate" value="" readonly>
<input class="field expenses" id="expenses" value="" inputmode="decimal">
<input class="field net" id="net" value="" readonly>
<input class="field contact" value="" aria-label="رقم التواصل">
</div>

<script>
const table = document.getElementById('tableFields');
const rowTops = ['44.1%','47.9%','51.7%','55.5%'];
const sample = [
  ['','','',''],
  ['','','',''],
  ['','','',''],
  ['','','','']
];

function addField(cls, top, value, type='text') {
  const x=document.createElement('input');
  x.className='field cell '+cls;
  x.style.top=top;
  x.value=value;
  x.type=type;
  x.addEventListener('input',calc);
  table.appendChild(x);
  return x;
}

function buildRows(){
  table.innerHTML='';
  rowTops.forEach((top,i)=>{
    addField('c-box r'+(i+1),top,sample[i][0],'number');
    addField('c-weight r'+(i+1),top,sample[i][1],'number');
    addField('c-item r'+(i+1),top,sample[i][2]);
    addField('c-price r'+(i+1),top,sample[i][3],'number');
    const amount=addField('c-amount r'+(i+1),top,'0.00 دج');
    amount.readOnly=true;
    amount.tabIndex=-1;
  });
  calc();
}

function fmt(n){
  return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' دج';
}

function calc(){
  let boxes=0,weight=0,total=0;
  for(let i=1;i<=4;i++){
    const b=Number(document.querySelector('.c-box.r'+i).value)||0;
    const w=Number(document.querySelector('.c-weight.r'+i).value)||0;
    const p=Number(document.querySelector('.c-price.r'+i).value)||0;
    const a=w*p;
    boxes+=b; weight+=w; total+=a;
    document.querySelector('.c-amount.r'+i).value=fmt(a);
  }
  const expenses=Number(String(document.getElementById('expenses').value).replace(/[^0-9.-]/g,''))||0;
  const net=total-(total*0.10)-expenses;
  document.getElementById('totalBoxes').value=boxes;
  document.getElementById('boxTotal').value=boxes;
  document.getElementById('totalWeight').value=weight.toLocaleString('fr-FR');
  document.getElementById('totalAmount').value=fmt(total);
  document.getElementById('sumSale').value=fmt(total);
  document.getElementById('net').value=fmt(net);
}

function newInvoice(){
  document.getElementById('invoiceNo').value='';
  document.getElementById('farmer').value='';
  document.getElementById('goods').value='خضر';
  document.getElementById('expenses').value='0';
  buildRows();
}

document.getElementById('expenses').addEventListener('input',calc);

buildRows();
</script>
</body>
</html>
